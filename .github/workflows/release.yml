# QaseeGuard のビルド・zip 作成・リリース公開（すべて自動）
#
# - main に push するたびにビルドして zip を作る（Artifacts からダウンロードできる）
# - Info.plist の CFBundleShortVersionString（例: 1.0.1）がまだリリースされていなければ、
#   タグ v1.0.1 を作って GitHub Releases に zip を公開する
#   → リリースしたいときは Info.plist のバージョンを上げて main に push するだけ
# - プルリクエストではビルドの確認だけ行う（リリースはしない）
#
# アプリは Intel / Apple シリコン両対応（ユニバーサル）なので、zip は 1 つで両方の Mac で動く。
name: Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write # タグとリリースの作成に必要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: バージョンを読む
        id: ver
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "バージョン: $version"

      - name: リリース済みか確認
        id: released
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION はリリース済みなので、今回はビルドだけ行います"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION を新しくリリースします"
          fi

      - name: ツールのバージョンを表示
        run: |
          sw_vers
          swiftc --version

      - name: ビルド（Intel / Apple シリコン両対応）
        env:
          APP: ${{ github.workspace }}/build/QaseeGuard.app
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash build.sh

      - name: zip を作る
        id: pkg
        run: echo "zip=$(bash package.sh build/QaseeGuard.app)" >> "$GITHUB_OUTPUT"

      - name: zip を Artifacts に保存
        uses: actions/upload-artifact@v4
        with:
          name: QaseeGuard-${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      - name: リリースを公開
        if: github.event_name == 'push' && steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "QaseeGuard $VERSION" \
            --generate-notes
